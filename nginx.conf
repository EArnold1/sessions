server {
    listen 9200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite asset files are content-hashed and can be safely cached indefinitely.
    location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Let React Router handle routes such as /history after a direct page load.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
